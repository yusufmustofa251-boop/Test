name: Test Real Bypass
on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install deps
        run: pip install requests pycryptodome fake-useragent
        
      - name: Run Real Test
        run: python test.py
